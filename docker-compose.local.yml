services:
  postgres:
    image: postgres:16-alpine
    container_name: apps-marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apps_marketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - apps_marketing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apps_marketing"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  apps_marketing_pgdata:
